name: XuanJia v1.2.2 Android Runtime

on:
  workflow_dispatch:
  push:
    branches: [ build/xuanjia-v1.2.2 ]
  pull_request:
    branches: [ main ]

concurrency:
  group: xuanjia-v122-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout public build carrier
        uses: actions/checkout@v4

      - name: Reconstruct and verify source payload
        shell: bash
        run: |
          set -euo pipefail
          cat xuanjia-ci/payload/part-* | base64 --decode > /tmp/xuanjia-v1.2.2.zip
          echo '944da3dfbc398715390b0a5ef931a9a63c978d71df2df2ef428e97c7ee2f8364  /tmp/xuanjia-v1.2.2.zip' | sha256sum -c -
          unzip -t /tmp/xuanjia-v1.2.2.zip
          mkdir -p xuanjia-build
          unzip -oq /tmp/xuanjia-v1.2.2.zip -d xuanjia-build
          test -s xuanjia-build/ci/v1.2.0-fix/xuanjia_guard.c
          test -s xuanjia-build/app/src/androidTest/assets/test_signer.p12.b64

      - name: Free disk space for emulator
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo apt-get clean
          df -h /

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 16 and Native toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.0.12077973' \
            'cmake;3.22.1'
          df -h /

      - name: Fetch APKEditor engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p xuanjia-build/app/libs
          curl --fail --location --retry 3 \
            'https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar' \
            --output xuanjia-build/app/libs/APKEditor.jar
          test -s xuanjia-build/app/libs/APKEditor.jar

      - name: Generate guard runtime assets
        shell: bash
        working-directory: xuanjia-build
        run: bash scripts/generate_guard_asset.sh

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run standard hardening inside Android 11 ART
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: Nexus 5
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -partition-size 2048
          script: cd xuanjia-build && gradle :app:connectedDebugAndroidTest --stacktrace --no-daemon

      - name: Collect runtime evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          cp -r xuanjia-build/app/build/reports/androidTests/connected runtime-evidence/report 2>/dev/null || true
          cp -r xuanjia-build/app/build/outputs/androidTest-results runtime-evidence/results 2>/dev/null || true
          find runtime-evidence -type f -maxdepth 8 -printf '%p %s bytes\n' | sort > runtime-evidence/FILES.txt

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XuanJiaProtector-v1.2.2-runtime-evidence
          path: runtime-evidence/**
          if-no-files-found: warn
          retention-days: 30
